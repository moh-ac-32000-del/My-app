kind = "mobile"
previewPath = "/retail-business-manager/"
title = "Retail Business Manager"
description = "A mobile-first business management foundation for phone, telecom, electronics, accessories, and repair shops, with Arabic RTL support, configurable store identity, dashboard insights, and scalable local data structures ready for future Firebase sync."
version = "1.0.0"
id = "artifacts/retail-business-manager"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/retail-business-manager/" ]
localPort = 20003

[services.development]
run = "pnpm --filter @workspace/retail-business-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/retail-business-manager", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/retail-business-manager", "run", "serve" ]

[services.env]
PORT = "20003"
BASE_PATH = "/retail-business-manager/"
