name: Retail Business Manager CI

on:
  pull_request:
    paths:
      - "artifacts/retail-business-manager/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/retail-business-manager-ci.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/retail-business-manager/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/retail-business-manager-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/retail-business-manager run typecheck

      - name: Validate Expo app configuration
        run: pnpm --filter @workspace/retail-business-manager exec expo config --json > /tmp/retail-business-manager-expo-config.json

      - name: Install Firebase Functions dependencies
        run: pnpm --dir artifacts/retail-business-manager/functions install --frozen-lockfile --ignore-workspace

      - name: Typecheck Firebase Functions
        run: pnpm --dir artifacts/retail-business-manager/functions run typecheck

      - name: Tests
        run: pnpm --filter @workspace/retail-business-manager run test

      - name: Independent static build
        run: pnpm --filter @workspace/retail-business-manager run build
        env:
          EXPO_PUBLIC_DEPLOYMENT_URL: https://example.invalid/retail-business-manager
